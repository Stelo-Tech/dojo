name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Only deploy from main — this workflow is intentionally triggered only on
    # push to main, but the condition is kept explicit for safety.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build
        env:
          # Sourcemaps disabled in production for security
          # See .claude/skills/security-review/index.md
          VITE_BUILD_SOURCEMAP: 'false'

      # -----------------------------------------------------------------------
      # PLACEHOLDER: Replace this step with your actual deployment target.
      # Options:
      #   - GitHub Pages  : actions/deploy-pages@v4
      #   - Firebase      : FirebaseExtended/action-hosting-deploy@v0
      #   - Netlify       : nwtgck/actions-netlify@v3
      #   - S3/CloudFront : aws-actions/configure-aws-credentials + aws s3 sync
      # -----------------------------------------------------------------------
      - name: Deploy (placeholder)
        run: |
          echo "Build artefact ready in ./dist — configure your deployment target here."
          ls -lh dist/
