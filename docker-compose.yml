services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    restart: unless-stopped
